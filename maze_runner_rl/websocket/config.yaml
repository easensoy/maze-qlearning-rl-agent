server:
  host: "localhost"
  port: 8765

training:
  speed: 1.0
  max_episodes: 1000
  max_steps_per_episode: 200
  update_interval: 10

agent:
  learning_rate: 0.1
  epsilon: 0.1
  epsilon_decay: 0.995
  epsilon_min: 0.01
  gamma: 0.95

maze:
  default_width: 21
  default_height: 21
  default_depth: 1
  wall_density: 0.65
  branching_factor: 0.4
  dead_end_percentage: 0.3

stats:
  episode: 0
  step: 0
  total_reward: 0
  epsilon: 0.1
  history_size: 100

timeouts:
  step_delay: 0.1
  training_delay: 0.05
  broadcast_timeout: 5.0