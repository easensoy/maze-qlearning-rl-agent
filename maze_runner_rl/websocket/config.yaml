server:
  host: "localhost"         # override with MAZE_SERVER_HOST (Docker sets 0.0.0.0)
  port: 8765                # override with MAZE_SERVER_PORT

training:
  speed: 20.0               # training steps per second; 1000 or more = no delay
  max_episodes: 1000        # episodes per press of Start Training
  max_steps_per_episode: 1000
  update_interval: 10       # send Q-values every N steps (at most twice per second)
  max_updates_per_second: 30

agent:
  learning_rate: 0.1
  epsilon: 0.1
  epsilon_decay: 0.995
  epsilon_min: 0.01
  gamma: 0.95

maze:
  default_width: 21
  default_height: 21
  default_depth: 1
  wall_density: 0.65        # target wall share; trimming stops early if no dead ends are left
  branching_factor: 0.4
  dead_end_percentage: 0.3

stats:
  episode: 0
  step: 0
  total_reward: 0
  epsilon: 0.1
  history_size: 100

timeouts:
  step_delay: 0.1
  training_delay: 0.05
  broadcast_timeout: 5.0
