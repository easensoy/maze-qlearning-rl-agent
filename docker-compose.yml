services:
  maze-backend:
    build: .
    ports:
      - "8765:8765"
    environment:
      - PYTHONPATH=/app
      - MAZE_SERVER_HOST=0.0.0.0
    volumes:
      - ./maze_runner_rl/websocket/config.yaml:/app/websocket/config.yaml
    restart: unless-stopped

  maze-frontend:
    build:
      context: ./maze-3d-frontend
      args:
        # Inlined into the production bundle; the browser connects to this URL.
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-ws://localhost:8765}
    ports:
      - "3001:3001"
    depends_on:
      - maze-backend
    restart: unless-stopped
