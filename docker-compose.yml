services:
  maze-backend:
    build: .
    ports:
      - "8765:8765"
    environment:
      - PYTHONPATH=/app
      - MAZE_SERVER_HOST=0.0.0.0
    volumes:
      - ./maze_runner_rl/websocket/config.yaml:/app/websocket/config.yaml
    restart: unless-stopped

  maze-frontend:
    build: ./maze-3d-frontend
    ports:
      - "3001:3001"
    depends_on:
      - maze-backend
    restart: unless-stopped
