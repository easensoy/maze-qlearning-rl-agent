# Serves the production build (npm run build) on port 3001.
server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names under /static/ carry a content hash; index.html is always revalidated.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
