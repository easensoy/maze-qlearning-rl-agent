name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maze_runner_rl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: maze_runner_rl/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maze-3d-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maze-3d-frontend/package-lock.json
      - run: npm ci
      - run: npx eslint --max-warnings=0 src
      - run: npm test -- --watchAll=false
      - run: npm run build  # CI=true: warnings fail the build (third-party source-map warnings excepted)

  docker:
    name: Docker images build and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the images
        run: |
          docker build -t maze-backend .
          docker build -t maze-frontend maze-3d-frontend
      - name: Backend container answers with a snapshot
        run: |
          docker run -d --name backend -p 8765:8765 maze-backend
          docker run --rm -i --network host maze-backend python - <<'EOF'
          import json
          import time
          from websockets.sync.client import connect

          for attempt in range(60):
              try:
                  with connect("ws://localhost:8765", open_timeout=2) as ws:
                      types = [json.loads(ws.recv(timeout=10))["type"] for _ in range(3)]
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("backend container did not answer")
          assert types == ["maze_state", "training_update", "q_values"], types
          print("snapshot:", types)
          EOF
      - name: Frontend container serves the app
        run: |
          docker run -d --name frontend -p 3001:3001 maze-frontend
          for attempt in $(seq 90); do
            if curl -fsS http://localhost:3001 > /dev/null; then
              echo "frontend answered on port 3001"
              exit 0
            fi
            sleep 2
          done
          docker logs frontend
          exit 1
